name: Uppdatera data

# Hämtar kommunernas kontroller, skriver till Supabase och exporterar en
# ögonblicksbild som bygget läser.
#
# Färskhet är inte kosmetik: sidor uppdaterade de senaste två månaderna får
# dokumenterat fler citeringar i AI-svar, och "senast uppdaterad" är en
# rankningssignal. Datan ska därför uppdateras av sig själv, inte av att
# någon minns att köra ett skript.

on:
  schedule:
    # 03:17 UTC. Udda minut med avsikt — hela världens cron-jobb ligger på
    # heltimmen, och GitHubs köer är långsammast just då.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      kommun:
        description: 'Enskild kommun att hämta (tomt = alla)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  hamta:
    name: Hämta ${{ matrix.kommun }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Alla kommuner parallellt: samma antal minuter totalt, men klockan
      # går fortare. En kommun som fallerar ska inte stoppa de andra.
      fail-fast: false
      matrix:
        # EN RAD PER KOMMUN, oavsett vilken hämtare kommunen läses av. Se
        # hämtsteget nedan för hur en kommun utan egen fetch_<slug>.py hittas.
        #
        # Norrköping stod utanför listan från 2026-08-31 till 2026-09-05 och
        # var därmed den enda av tretton kommuner som aldrig uppdaterades.
        # Nattkörningarna 1 till 5 september rörde inte norrkoping.json med en
        # enda rad medan varje annan kommunfil fick ny fetchedAt, och filen var
        # alltså en ren produkt av en manuell körning av fetch_ecos.py.
        #
        # Det brådskade inte, för källan står stilla sedan 2024-03-17, men en
        # kommun som aldrig uppdateras ska inte vara det av misstag. Hämtaren
        # pekar sedan 2026-08-31 på nodadressen som omdirigerar till den
        # AKTUELLA versionen, se MUNICIPALITIES i prikko/sources/ecos.py, så
        # den dag kommunen lägger upp ett nytt utdrag plockas det upp av sig
        # självt i stället för att vänta på att någon minns filen.
        kommun: [linkoping, stockholm, uppsala, jonkoping, karlstad, orebro, oskarshamn,
                 lomma, hoganas, svenljunga, kristinehamn, borgholm, norrkoping]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Tre kommuner når GitHubs löpare bara ibland, och det är inget vi kan
      # koda oss ur.
      #
      # www.orebro.se (185.84.52.243), www.hoganas.se (185.84.52.249) och
      # lomma.se (185.84.52.48) ligger på samma webbhotell och har alla en
      # AAAA-adress i 2a05:a140::/32. Från Sverige svarar alla tre med 200 på
      # under 0,4 sekunder, även med vår egen robot-user-agent. Från löparen,
      # som står i Azure westus3, hänger anslutningen i 120 sekunder och dör
      # sedan, tre försök i rad.
      #
      # Felmeddelandet "Network is unreachable" pekade fel i tolv nätter.
      # Löparen saknar IPv6-väg, så AAAA-försöket faller ögonblickligen med
      # ENETUNREACH, medan de 120 sekunderna gick åt till IPv4 som tog timeout.
      # `socket.create_connection` behåller BARA det sista felet av alla
      # adresser (se kommentaren "raise only the last error" i CPython), och
      # eftersom IPv6 provas sist är det den ögonblickliga miss som syns medan
      # den långsamma IPv4-timeouten göms. IPv6 var alltså aldrig problemet.
      #
      # Att en IPv4-anslutning hänger i 120 sekunder i stället för att nekas är
      # vad en brandvägg som SLÄNGER paket ser ut som, och därav gissningen
      # 2026-08-14 att de tre spärrat utländska eller moln-IP. Den gissningen
      # skrevs ned som en slutsats, och det var fel: spärr är permanent, det
      # här är det inte. Utfallet natt för natt, läst ur loggarna eftersom
      # continue-on-error skriver om stegets resultat till "success":
      #
      #   08-14 21:22 manuell    Höganäs 310 poster, Örebro föll på ett
      #                          kodfel, Lomma unreachable
      #   08-15 00:37 manuell    Örebro 1233, Höganäs 310, Lomma unreachable
      #   08-15 03:52 schemalagd Örebro 1233, Höganäs och Lomma unreachable
      #   08-16 03:58 schemalagd alla tre unreachable
      #   08-17 04:00 schemalagd alla tre unreachable
      #
      # Örebro och Höganäs kom alltså igenom två gånger var från samma
      # löparflotta, Lomma inte en enda gång på sex försök. Det är ett
      # ostadigt nät eller en tröskel hos webbhotellet, inte en stängd dörr.
      #
      # De tre får därför varna i stället för att fälla körningen, medan alla
      # andra kommuner fortfarande fäller den rött. En tyst grön natt vore
      # värre än ett mejl. Vill vi ha dem varje natt behövs en löpare i
      # Sverige eller en proxy, och det är ett beslut och inte en rättelse.
      #
      # Lärdomen är värd att stå kvar: en gissning som skrivs ned som en
      # slutsats blir svårare att motbevisa för varje natt den får stå.
      #
      # SEPTEMBER 2026: ETT ANNAT FEL, OCH DET HAR EN KÄND ORSAK. Från 11
      # september föll alla tre, plus Norrköping, på samma rad:
      #
      #   HTTP Error 307: The HTTP server returned a redirect error that
      #   would lead to an infinite loop.
      #
      # Ingen tidsgräns och inget "unreachable". Alla fyra kör Sitevision bakom
      # en F5-balanserare (kakan SiteVisionLTM), och urllib följer en 307 utan
      # att ta med kakan servern just satt, så andra varvet får samma svar och
      # urllib ger upp. Hämtarna använder sedan 2026-09-14 en gemensam öppnare
      # med kakburk, se pipeline/prikko/natverk.py.
      #
      # Prövat samma kväll med workflow_dispatch för bara Lomma, från samma
      # löparflotta som föll på morgonen: 153 anläggningar, inga omförsök, ingen
      # 307. Det var Lommas första lyckade hämtning sedan 11 september.
      #
      # EN KÖRNING ÄR INTE ETT BEVIS, eftersom de tidigare felen var ostadiga.
      # continue-on-error står därför kvar tills flera nätter i rad visat alla
      # tre gröna med data. En grön natt syns numera på riktigt: halsokoll.mjs
      # läser hämtdatum per kommun och varnar efter tre dagar, så en tom
      # hämtning kan inte längre gömma sig bakom en grön bock.

      # HÄMTAREN HETER INTE ALLTID SOM KOMMUNEN, och det är sant sedan
      # Norrköping. Steget körde förr `pipeline/fetch_${{ matrix.kommun }}.py`
      # rakt av, alltså kunde bara en kommun med en egen fil stå i matrisen.
      #
      # Tolv kommuner har en sådan fil, skriven mot den enskilda kommunens
      # sida. Norrköping har ingen och ska aldrig få en: den läses av
      # pipeline/fetch_ecos.py, som är skriven mot FORMATET och tar kommunen
      # som argument. Skälet står i prikko/sources/ecos.py: ecos.xml är
      # Sokigos ärendesystems egen utdragsform och inte något Norrköpings
      # webbredaktion satt ihop, så samma läsare bör passa varje kommun som
      # kör Ecos.
      #
      # Ordningen är egen fil först, formathämtare sedan. Frågan ställs till
      # MUNICIPALITIES i prikko/sources/ecos.py, alltså till exakt den tabell
      # `--kommun` ändå validerar mot. DÄRFÖR ÄR NÄSTA ECOS-KOMMUN EN RAD OCH
      # INGET UNDANTAG: raden i MUNICIPALITIES är villkoret för att kommunen
      # ska gå att hämta överhuvudtaget, och matrisen behöver bara sin slug.
      #
      # En kommun som varken har en egen fil eller står i tabellen faller rött
      # här, med namnet på det som saknas. Att i stället skicka den blint till
      # fetch_ecos.py hade gett argparses "invalid choice" några rader senare,
      # ett meddelande som pekar på fel sak den dagen en tredje sorts hämtare
      # tillkommer.
      #
      # Slugen går genom miljön och inte genom ${{ }} inne i skalet. Värdena i
      # matrisen är våra egna, men `kommun` från workflow_dispatch är det inte,
      # och ett interpolerat värde är text som klistras in i skriptet före
      # körning.
      - name: Hämta
        if: ${{ github.event.inputs.kommun == '' || github.event.inputs.kommun == matrix.kommun }}
        continue-on-error: ${{ contains(fromJSON('["orebro", "hoganas", "lomma"]'), matrix.kommun) }}
        env:
          KOMMUN: ${{ matrix.kommun }}
        run: |
          if [ -f "pipeline/fetch_$KOMMUN.py" ]; then
            python3 "pipeline/fetch_$KOMMUN.py" --out "data/$KOMMUN.json"
          elif python3 -c 'import sys; sys.path.insert(0, "pipeline"); from prikko.sources.ecos import MUNICIPALITIES; sys.exit(0 if sys.argv[1] in MUNICIPALITIES else 1)' "$KOMMUN"; then
            python3 pipeline/fetch_ecos.py --kommun "$KOMMUN" --out "data/$KOMMUN.json"
          else
            echo "::error title=Ingen hämtare::$KOMMUN har varken pipeline/fetch_$KOMMUN.py eller en rad i MUNICIPALITIES i pipeline/prikko/sources/ecos.py. Lägg till kommunen i en av dem, eller ta bort den ur matrisen."
            exit 1
          fi

      - name: Spara som artefakt
        if: ${{ github.event.inputs.kommun == '' || github.event.inputs.kommun == matrix.kommun }}
        uses: actions/upload-artifact@v4
        with:
          name: data-${{ matrix.kommun }}
          path: data/${{ matrix.kommun }}.json
          retention-days: 7

  ladda:
    name: Ladda och exportera
    needs: hamta
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Sextio och inte trettio, sedan IndexNow-steget tillkom. Trettio räckte så
    # länge jobbet slutade vid commiten; nu väntar sista steget på att
    # Cloudflare Pages ska rulla ut bygget innan det anmäler adresserna, och
    # den väntan är satt till 25 minuter i pipeline/indexnow.py. Stegen före
    # den tar normalt en kvart. Med trettio hade jobbet dött mitt i väntan i
    # stället för att låta steget falla mjukt och skriva varför.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Hämta artefakter
        uses: actions/download-artifact@v4
        with:
          path: data
          merge-multiple: true

      - name: Skriv till Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          shopt -s nullglob
          files=(data/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Inga datafiler att ladda — avbryter."
            exit 1
          fi
          # Rörelsen skrivs i TVÅ steg, ett på var sin sida om inläsningen, och
          # det är inte en omväg utan det enda som fungerar.
          #
          # Jämförelsen måste ske FÖRE inläsningen. Den ställer nattens
          # utlämning mot föregående körnings, och körs den efteråt jämförs
          # utlämningen med sig själv: noll nya och noll borta, varje natt,
          # tyst. Skriptet vägrar om ordningen kastas om.
          #
          # Men sviterna för de NYA verksamheterna kan inte skrivas då.
          # establishment_spells.establishment_id pekar med en främmande nyckel
          # på establishments.id, och en ny verksamhet har ingen sådan rad
          # förrän load_supabase.py har kört. Nattjobbet föll på exakt det i
          # tolv nätter i rad: 409 23503, "Key (establishment_id) is not
          # present in table". Sex av nio kommuner tappades varje natt.
          #
          # Jämförelsen körs alltså först och lägger sviterna åt sidan,
          # inläsningen skapar raderna, och sviterna skrivs sist.
          python3 pipeline/rorelse.py registrera "${files[@]}" \
            --sviter-till data/uppskjutna-sviter.json
          python3 pipeline/load_supabase.py "${files[@]}"
          python3 pipeline/rorelse.py sviter data/uppskjutna-sviter.json

      - name: Exportera ögonblicksbild till bygget
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 pipeline/export_supabase.py --out site/src/data
          python3 pipeline/rorelse.py exportera

      # MÅSTE ligga mellan exporten och commiten. Steget jämför arbetskopian
      # (dagens export) med HEAD (gårdagens incheckade ögonblicksbild). Efter
      # commiten är de två samma sak och jämförelsen ger noll varje natt.
      #
      # continue-on-error med avsikt: att ett utskick fallerar får inte hindra
      # att datan checkas in. Datan är produkten, notisen är en tjänst ovanpå.
      # Felet syns ändå som ett rött kryss på steget.
      - name: Notiser om bevakade verksamheter
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PRIKKO_MAIL_FROM: ${{ vars.PRIKKO_MAIL_FROM }}
        run: |
          # `--notiser` i BÅDA grenarna, och det är rättelsen.
          #
          # Listan på kontot är vad en bevakning är; mejlet är påminnelsen om
          # den. Utan nyckel kördes tidigare en ren torrkörning, alltså skrevs
          # inte heller listan, och en bevakning gjorde ingenting alls förrän
          # ägaren lagt in RESEND_API_KEY. Nu fylls kontot varje natt och
          # mejlet slås på den dag nyckeln finns.
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::warning title=Notiser utan mejl::RESEND_API_KEY saknas i GitHub-hemligheterna. Kontots lista fylls, inga mejl skickas."
            python3 pipeline/notify.py --notiser
          else
            python3 pipeline/notify.py --notiser --skicka
          fi

      # MÅSTE ligga före commiten, av exakt samma skäl som notissteget ovan.
      # Steget jämför arbetskopian med HEAD, alltså nattens export mot
      # gårdagens incheckade ögonblicksbild. Efter commiten är de två samma sak
      # och listan blir tom varje natt, tyst.
      #
      # Här räknas bara fram VAD som ändrats. Anmälan sker sist i jobbet,
      # eftersom en anmälan säger "hämta den här adressen nu" och sidan inte är
      # utrullad förrän Cloudflare Pages byggt den nya commiten.
      #
      # Ingen hemlighet behövs. IndexNow-nyckeln är publik med flit och ligger
      # i site/public/, se huvudet på pipeline/indexnow.py.
      - name: Räkna fram vilka adresser som ändrats
        continue-on-error: true
        run: |
          mkdir -p data
          python3 pipeline/indexnow.py andrade --ut data/indexnow-urler.txt

      - name: Sammanfatta förändringen
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, glob, collections
          print('## Datauppdatering\n')
          print('| Kommun | Verksamheter | Kontroller | Utan anm. | Brister | Kvarstår |')
          print('|---|---:|---:|---:|---:|---:|')
          for path in sorted(glob.glob('site/src/data/*.json')):
              d = json.load(open(path))
              es = d['establishments']
              c = collections.Counter(e['verdict'] for e in es)
              print(f"| {d['municipality']['city']} | {len(es)} | "
                    f"{sum(len(e['inspections']) for e in es)} | "
                    f"{c.get('clean',0)} | {c.get('minor',0)} | {c.get('major',0)} |")
          PY

      - name: Committa om något ändrats
        run: |
          git config user.name  "prikko-bot"
          git config user.email "bot@prikko.se"
          git add site/src/data
          if git diff --staged --quiet; then
            echo "Inga förändringar i datan."
          else
            git commit -m "Uppdatera data $(date -u +%Y-%m-%d)"

            # Ombasering före push, och det är ingen försiktighetsåtgärd.
            #
            # Körningen tar omkring 50 minuter från utcheckning till push, och
            # utcheckningen är från när den STARTADE. Varje incheckning som
            # sker under tiden gör bottens push till en icke snabbspolning.
            # Då faller nattjobbet på sista raden med allt redan gjort: tolv
            # kommuner hämtade, Supabase skrivet, ögonblicksbilden exporterad
            # och commiten byggd. Allt kastas för att någon annan hann före.
            #
            # Uppmätt 2026-08-17: sex commits landade på main under körningen,
            # push avvisades med "fetch first", och nattens data gick förlorad
            # efter 50 minuters arbete.
            #
            # Botten rör bara site/src/data, en katalog ingen människa
            # redigerar för hand, så en ombasering ovanpå main är konfliktfri
            # i praktiken. Blir den det ändå ska steget falla rött i stället
            # för att tvinga fram något: --force här hade tyst raderat den
            # andres arbete.
            for forsok in 1 2 3; do
              if git push; then
                echo "Datan är incheckad."
                break
              fi
              if [ "$forsok" = 3 ]; then
                echo "Push avvisad tre gånger i rad. Ger upp."
                exit 1
              fi
              echo "Push avvisad, main har rört sig. Ombaserar och försöker igen."
              git pull --rebase origin main
            done
          fi

      # EFTER commiten, och det är hela poängen med placeringen.
      #
      # Steget väntar tills prikko.se serverar nattens bygge och anmäler sedan
      # de adresser föregående steg räknade fram. Anmäls de före utrullningen
      # hämtar roboten gårdagens sida, och för en ny verksamhet en 404.
      #
      # continue-on-error av samma skäl som notissteget: datan är produkten,
      # anmälan är en tjänst ovanpå. En slutpunkt som inte svarar får inte
      # färga natten röd, och adresserna kommer med i morgondagens körning
      # eftersom de fortfarande skiljer sig från gårdagens incheckning då.
      #
      # Ligger FÖRE frysgrinden nedan, som avslutar jobbet med exit 1. En
      # kommun som frös ska inte hindra att de tolv friska anmäls.
      - name: Anmäl de ändrade adresserna till IndexNow
        continue-on-error: true
        timeout-minutes: 35
        run: |
          if [ ! -s data/indexnow-urler.txt ]; then
            echo "Ingen lista att anmäla. Föregående steg skrev ingen fil."
            exit 0
          fi
          python3 pipeline/indexnow.py anmal data/indexnow-urler.txt

      # SIST, och det är hela poängen med steget.
      #
      # En kommun vars kontrollpunkter eller kartnålar rasar behåller gårdagens
      # fil i stället för att skrivas över, se report_collapse i
      # pipeline/export_supabase.py.
      # Förr avbröt exporten i stället hela körningen, och 2026-08-17 höll den
      # därmed elva friska kommuners färska data borta i tolv dagar för att
      # Lomma bytt sidformat.
      #
      # Men en kommun som fryser tyst fryser för alltid. Därför faller
      # körningen här, EFTER att datan är incheckad: sajten får sitt, och
      # mejlet kommer ändå.
      #
      # Sökvägen är site/src/ och inte data/. report_collapse skriver markören
      # bredvid utkatalogen, alltså `--out site/src/data` upp ett steg. Steget
      # läste data/rasade-kommuner.txt, en fil som aldrig skrivs, så villkoret
      # var alltid falskt och en frusen kommun hade passerat tyst. Det är
      # precis det tysta frysandet steget finns för att förhindra.
      - name: Fäll körningen om någon kommun frös
        run: |
          if [ -s site/src/rasade-kommuner.txt ]; then
            echo "Dessa kommuner behöll gårdagens data, med skälet grinden gav:"
            cat site/src/rasade-kommuner.txt
            echo "Övriga kommuner är incheckade. Gäller det kontrollpunkter:"
            echo "börja i kommunens hämtare, den upptäcker oftast själv att"
            echo "sidformatet ändrats. Gäller det kartnålar: börja i harledda"
            echo "i pipeline/export_supabase.py och i pipeline/geocode.py."
            exit 1
          fi
          echo "Ingen kommun frös."
