<!--
  Mejlmallen för inloggningskoden.

  KLISTRAS IN I SUPABASE, byggs inte av sajten:
  Authentication  ->  Emails  ->  Magic Link  ->  ersätt hela innehållet.
  Ämnesrad: Din kod till Prikko

  Supabase skickar som förval en LÄNK. Vi vill ha SIFFROR, och det är
  {{ .Token }} på rad 63 som gör hela skillnaden. Utan den variabeln kommer
  mejlet fram men utan något att skriva in, och verifyCode i
  site/src/lib/community.ts har ingenting att växla in.

  Varför tabeller och inline-stil i stället för vanlig CSS: Outlook på Windows
  renderar med Word och struntar i det mesta i en <style>-tagg. Gmail rensar
  bort hela taggen. Det här är den enda formen som håller överallt, hur gammal
  den än ser ut.

  Mörkt läge är avsiktligt inte hanterat. Gmail och Outlook inverterar färger
  på egen hand och gör det olika, och varje försök att styra det slutar med en
  ruta som ser trasig ut i minst en klient. Vit botten och mörk text överlever
  inverteringen läsbart.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#FCFCFD;margin:0;padding:32px 12px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:440px;background:#FFFFFF;border:1px solid rgba(0,0,0,.08);border-radius:14px;">

        <tr>
          <td style="padding:32px 32px 0;">
            <!-- Logotypen som PNG, inte som SVG. Gmail rensar bort SVG helt
                 och Outlook renderar den inte alls, så en inlinad vektor hade
                 gett tom yta hos de två klienter flest mottagare använder.
                 Filen ligger i site/public och följer med varje bygge.

                 Bredd och höjd står som ATTRIBUT och inte bara i stilen.
                 Outlook läser Word-motorn och struntar i CSS-mått, och utan
                 attributen ritas bilden i sin fulla pixelbredd, alltså tre
                 gånger för stor. Källan är 228x85 för att vara skarp på
                 skärmar med hög täthet.

                 De flesta klienter blockerar bilder tills mottagaren klickat
                 "visa bilder". Färg, storlek och vikt sitter därför på
                 img-taggen själv: alt-texten ÄRVER dem, så det blockerade
                 läget visar ordet Prikko i blått och fetstil i stället för en
                 trasig ruta. Det är hela poängen med att skriva stilen här
                 och inte på en omslutande div. -->
            <img src="https://prikko.se/prikko-wordmark-email.png"
                 alt="Prikko"
                 width="76" height="28"
                 style="display:block;border:0;outline:none;text-decoration:none;width:76px;height:28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:24px;font-weight:700;letter-spacing:-.02em;color:#007BE0;">
          </td>
        </tr>

        <tr>
          <td style="padding:24px 32px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.55;color:#1D1D1F;">
            Här är din kod. Den gäller i en timme.
          </td>
        </tr>

        <tr>
          <td align="center" style="padding:24px 32px 0;">
            <!-- Siffrorna är själva mejlet. Stora nog att läsas på en telefon
                 i en restaurang, glest spärrade så att två ettor inte flyter
                 ihop, och i monospace så att koden går att jämföra tecken för
                 tecken med det man skrivit in. -->
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="background:#FCFCFD;border:1px solid rgba(0,0,0,.08);border-radius:10px;">
              <tr>
                <td style="padding:18px 28px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:32px;font-weight:600;letter-spacing:.22em;color:#1D1D1F;text-indent:.22em;">{{ .Token }}</td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td style="padding:24px 32px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;line-height:1.55;color:#56565B;">
            Skriv in koden i webbläsaren där du började logga in.
          </td>
        </tr>

        <tr>
          <td style="padding:20px 32px 0;">
            <div style="height:1px;background:rgba(0,0,0,.08);font-size:0;line-height:0;">&nbsp;</div>
          </td>
        </tr>

        <tr>
          <td style="padding:16px 32px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;line-height:1.6;color:#56565B;">
            Har du inte försökt logga in på Prikko? Då kan du strunta i det här
            mejlet. Ingen kommer in på ditt konto utan koden, och den är bara
            skickad till dig.
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
