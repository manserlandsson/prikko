<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Prikko">
<!--
  ORDMÄRKETS SMILEY, INTE GRÄVLINGEN.

  Ägaren 2026-08-24: "tror jag inte vi borde ha grävlingen som vår favicon men
  vår prikko smiley bara, den är mer clean."

  Här låg grävlingens ansikte, genererat av brand/bygg-face-geometri.mjs. Det
  var rätt tecken på fel plats. En favicon ritas i 16 px i fliklisten, och där
  finns ingen plats för nos, öron, bryn och pupiller: figuren blev en fläck.
  Smileyn är tre former, två prickar och en båge, och de tål 16 px.

  GEOMETRIN ÄR ORDMÄRKETS EGEN, inte en ny ritning. Banorna är kopierade
  ordagrant ur site/src/components/Wordmark.astro, som i sin tur är Måns fil
  från Figma, och sedan skalade och centrerade i rutan. Ögonen sitter på
  (139,5, 23,5) och (152,5, 23,5) med radie 3, munnen går från x 135 till 156
  med streckbredd 4,5. Ändras ordmärket ska den här följa med.

  Bläckets låda i ordmärkets koordinater: x 132,75 till 158,25 och y 20,5 till
  41,25, alltså 25,5 × 20,75. Skalan 2,43 ger märket 62 procent av rutans
  bredd, vilket lämnar luft nog att den rundade kvadraten läser som en form
  och inte som en ram runt en fylld yta.

  Blå ruta och vitt märke, som förut. Ikonen säger vem sajten är, inte hur det
  står till med en verksamhet, så den ska aldrig bära bedömningens grönt,
  gult eller rött.
-->
  <rect width="100" height="100" rx="22" fill="#007BE0" />
  <g transform="translate(-303.6 -25.0) scale(2.43)" fill="none">
    <path
      d="M139.5 20.5c1.657 0 3 1.343 3 3s-1.343 3-3 3-3-1.343-3-3 1.343-3 3-3Z"
      fill="#fff"
      stroke="#fff"
    />
    <path
      d="M152.5 20.5c1.657 0 3 1.343 3 3s-1.343 3-3 3-3-1.343-3-3 1.343-3 3-3Z"
      fill="#fff"
      stroke="#fff"
    />
    <path
      d="M135 34c7 6.667 14 6.667 21 0"
      stroke="#fff"
      stroke-width="4.5"
      stroke-linecap="round"
    />
  </g>
</svg>
