<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="180" height="180" role="img" aria-label="Prikko">
<!--
  Underlag för apple-touch-icon.png, rasteriseras av brand/bygg-appikon.mjs.

  UTAN rundade hörn med flit: iOS maskar ikonen själv, och en ikon som bär sin
  egen radie får en dubbel kant på hemskärmen.

  ORDMÄRKETS SMILEY, INTE GRÄVLINGEN, sedan 2026-08-24. Ägaren: "tror jag inte
  vi borde ha grävlingen som vår favicon men vår prikko smiley bara, den är
  mer clean." Samma beslut som favicon.svg, och de två ska alltid visa samma
  figur: en hemskärmsikon och en flikikon som skiljer sig är två varumärken.

  Geometrin är ordmärkets egen, kopierad ur Wordmark.astro och skalad. Se
  favicon.svg för räkningen bakom skalan och förskjutningen. Måtten skiljer sig
  eftersom den här saknar rundade hörn och därför tål ett något större märke.
-->
  <rect width="100" height="100" fill="#007BE0" />
  <g transform="translate(-303.6 -25.0) scale(2.43)" fill="none">
    <path
      d="M139.5 20.5c1.657 0 3 1.343 3 3s-1.343 3-3 3-3-1.343-3-3 1.343-3 3-3Z"
      fill="#fff"
      stroke="#fff"
    />
    <path
      d="M152.5 20.5c1.657 0 3 1.343 3 3s-1.343 3-3 3-3-1.343-3-3 1.343-3 3-3Z"
      fill="#fff"
      stroke="#fff"
    />
    <path
      d="M135 34c7 6.667 14 6.667 21 0"
      stroke="#fff"
      stroke-width="4.5"
      stroke-linecap="round"
    />
  </g>
</svg>
